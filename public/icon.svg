<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#071222" />
    </linearGradient>

    <linearGradient id="pwaBlueArch" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="pwaCyanArch" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="pwaSaffron" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="pwaPeople" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="tricolorStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="33.3%" stop-color="#FF9933" />
      <stop offset="33.3%" stop-color="#FFFFFF" />
      <stop offset="66.6%" stop-color="#FFFFFF" />
      <stop offset="66.6%" stop-color="#138808" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>

    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#pwaBg)" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Tricolor Accent Header Line -->
  <rect x="96" y="56" width="320" height="8" rx="4" fill="url(#tricolorStrip)" />

  <!-- Centered Emblem Mark -->
  <g transform="translate(68, 85) scale(1.6)">
    <!-- Ambient Backdrop Aura -->
    <ellipse cx="115" cy="100" rx="95" ry="75" fill="#00D2FF" opacity="0.16" filter="url(#pwaGlow)" />

    <!-- 1. Outer Deep Blue Arch -->
    <path d="M 22 142 A 85 85 0 0 1 170 70" 
          fill="none" stroke="url(#pwaBlueArch)" stroke-width="18" stroke-linecap="round" />
    <path d="M 30 140 A 78 78 0 0 1 164 76" 
          fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- 2. Interlocking Saffron Arch (Right Leg) -->
    <path d="M 125 64 A 78 78 0 0 1 185 142" 
          fill="none" stroke="url(#pwaSaffron)" stroke-width="18" stroke-linecap="round" />

    <!-- 3. Interlocking Cyan Arch (Main Crown) -->
    <path d="M 64 142 A 78 78 0 0 1 190 120" 
          fill="none" stroke="url(#pwaCyanArch)" stroke-width="18" stroke-linecap="round" />
    <path d="M 72 140 A 72 72 0 0 1 160 68" 
          fill="none" stroke="#E0F2FE" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

    <!-- 4. Civic Community Figure (3 Citizen Heads + Bridge Smile) -->
    <circle cx="128" cy="85" r="9.5" fill="url(#pwaPeople)" />
    <circle cx="106" cy="94" r="8" fill="url(#pwaPeople)" />
    <circle cx="150" cy="94" r="8" fill="url(#pwaPeople)" />

    <!-- Smiling Citizen Bridge / Open Arms -->
    <path d="M 88 102 C 102 138 154 138 168 102" 
          fill="none" stroke="url(#pwaPeople)" stroke-width="11" stroke-linecap="round" />

    <!-- 5. Digital Network Lines -->
    <g stroke="#38BDF8" stroke-width="2.2" opacity="0.85">
      <line x1="92" y1="124" x2="128" y2="152" />
      <line x1="164" y1="124" x2="128" y2="152" />
      <line x1="92" y1="124" x2="62" y2="136" />
      <line x1="164" y1="124" x2="194" y2="136" />
      <line x1="128" y1="152" x2="128" y2="166" />
      <line x1="92" y1="124" x2="128" y2="124" />
      <line x1="128" y1="124" x2="164" y2="124" />
      <line x1="28" y1="105" x2="48" y2="82" />
      <line x1="20" y1="110" x2="42" y2="130" />
      <line x1="194" y1="102" x2="208" y2="118" />
    </g>

    <!-- Network Nodes -->
    <circle cx="128" cy="166" r="5.5" fill="#00E5FF" filter="url(#pwaGlow)" />
    <circle cx="128" cy="152" r="4.5" fill="#38BDF8" />
    <circle cx="92" cy="124" r="4.5" fill="#00D2FF" />
    <circle cx="164" cy="124" r="4.5" fill="#00D2FF" />
    <circle cx="128" cy="124" r="3.5" fill="#BAE6FD" />
    <circle cx="62" cy="136" r="4" fill="#38BDF8" />
    <circle cx="194" cy="136" r="4" fill="#38BDF8" />
    <circle cx="20" cy="110" r="4.5" fill="#2563EB" />
    <circle cx="28" cy="105" r="3.5" fill="#38BDF8" />
    <circle cx="48" cy="82" r="3.5" fill="#2563EB" />
    <circle cx="194" cy="102" r="3.5" fill="#38BDF8" />
    <circle cx="208" cy="118" r="4" fill="#0284C7" />

    <!-- Sparkle Stars -->
    <path d="M 50 40 L 52 46 L 58 48 L 52 50 L 50 56 L 48 50 L 42 48 L 48 46 Z" fill="#00D2FF" />
    <path d="M 185 35 L 187 42 L 194 44 L 187 46 L 185 53 L 183 46 L 176 44 L 183 42 Z" fill="#00D2FF" />
    <path d="M 64 85 L 65 89 L 69 90 L 65 91 L 64 95 L 63 91 L 59 90 L 63 89 Z" fill="#F59E0B" />
  </g>
</svg>
