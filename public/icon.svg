      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="33.3%" stop-color="#FF9933" />
      <stop offset="33.3%" stop-color="#FFFFFF" />
      <stop offset="66.6%" stop-color="#FFFFFF" />
      <stop offset="66.6%" stop-color="#138808" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- Tricolor Accent Ring / Header Accent -->
  <rect x="80" y="80" width="352" height="12" rx="6" fill="url(#tricolor)" />

  <!-- Shield Shape -->
  <path d="M256 120 C340 120 380 150 380 230 C380 340 280 400 256 420 C232 400 132 340 132 230 C132 150 172 120 256 120 Z" 
