<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%">
  <defs>
    <!-- Outer Blue 3D Arch Gradient -->
    <linearGradient id="blueArchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Top Arch (Cyan to Saffron) -->
    <linearGradient id="cyanToSaffronGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Inner Saffron Arch Accent -->
    <linearGradient id="saffronArchGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Civic People Cyan Gradient -->
    <linearGradient id="cyanPeopleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- AI Gradient -->
    <linearGradient id="aiBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="rgba(0,0,0,0.25)" />
    </filter>

    <!-- Glow for Nodes -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brandText { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .themeText { fill: #0F172A; }
    @media (prefers-color-scheme: dark) {
      .themeText { fill: #FFFFFF; }
    }
    :root[data-theme="dark"] .themeText { fill: #FFFFFF; }
  </style>

  <!-- ================= EMBLEM ================= -->
  <g transform="translate(15, 8)">
    <!-- Ambient Backdrop Aura -->
    <ellipse cx="105" cy="95" rx="85" ry="65" fill="#00D2FF" opacity="0.08" />

    <!-- 1. Outer Deep Blue Arch -->
    <path d="M 22 142 A 85 85 0 0 1 170 70" 
          fill="none" stroke="url(#blueArchGrad)" stroke-width="17" stroke-linecap="round" />
    <!-- Outer Arch Top Highlight -->
    <path d="M 30 140 A 78 78 0 0 1 164 76" 
          fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- 2. Interlocking Saffron Arch (Right Leg) -->
    <path d="M 125 64 A 78 78 0 0 1 185 142" 
          fill="none" stroke="url(#saffronArchGrad)" stroke-width="17" stroke-linecap="round" filter="url(#softShadow)" />

    <!-- 3. Interlocking Cyan Arch (Main Crown) -->
    <path d="M 64 142 A 78 78 0 0 1 190 120" 
          fill="none" stroke="url(#cyanToSaffronGrad)" stroke-width="17" stroke-linecap="round" filter="url(#softShadow)" />
    <!-- Cyan Crown Highlight -->
    <path d="M 72 140 A 72 72 0 0 1 160 68" 
          fill="none" stroke="#E0F2FE" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

    <!-- 4. Civic Community Figure (3 Citizen Heads + Bridge Smile) -->
    <!-- Center Head -->
    <circle cx="128" cy="85" r="9.5" fill="url(#cyanPeopleGrad)" filter="url(#softShadow)" />
    <!-- Left Head -->
    <circle cx="106" cy="94" r="8" fill="url(#cyanPeopleGrad)" />
    <!-- Right Head -->
    <circle cx="150" cy="94" r="8" fill="url(#cyanPeopleGrad)" />

    <!-- Smiling Citizen Bridge / Open Arms -->
    <path d="M 88 102 C 102 138 154 138 168 102" 
          fill="none" stroke="url(#cyanPeopleGrad)" stroke-width="11" stroke-linecap="round" />

    <!-- 5. Digital Network Lines -->
    <g stroke="#38BDF8" stroke-width="2.2" opacity="0.85">
      <line x1="92" y1="124" x2="128" y2="152" />
      <line x1="164" y1="124" x2="128" y2="152" />
      <line x1="92" y1="124" x2="62" y2="136" />
      <line x1="164" y1="124" x2="194" y2="136" />
      <line x1="128" y1="152" x2="128" y2="166" />
      <line x1="92" y1="124" x2="128" y2="124" />
      <line x1="128" y1="124" x2="164" y2="124" />
      <line x1="28" y1="105" x2="48" y2="82" />
      <line x1="20" y1="110" x2="42" y2="130" />
      <line x1="194" y1="102" x2="208" y2="118" />
    </g>

    <!-- Network Nodes (Glowing Dots) -->
    <circle cx="128" cy="166" r="5.5" fill="#00E5FF" filter="url(#nodeGlow)" />
    <circle cx="128" cy="152" r="4.5" fill="#38BDF8" />
    <circle cx="92" cy="124" r="4.5" fill="#00D2FF" />
    <circle cx="164" cy="124" r="4.5" fill="#00D2FF" />
    <circle cx="128" cy="124" r="3.5" fill="#BAE6FD" />
    <circle cx="62" cy="136" r="4" fill="#38BDF8" />
    <circle cx="194" cy="136" r="4" fill="#38BDF8" />
    <circle cx="20" cy="110" r="4.5" fill="#2563EB" />
    <circle cx="28" cy="105" r="3.5" fill="#38BDF8" />
    <circle cx="48" cy="82" r="3.5" fill="#2563EB" />
    <circle cx="194" cy="102" r="3.5" fill="#38BDF8" />
    <circle cx="208" cy="118" r="4" fill="#0284C7" />

    <!-- Sparkle Stars -->
    <path d="M 50 40 L 52 46 L 58 48 L 52 50 L 50 56 L 48 50 L 42 48 L 48 46 Z" fill="#00D2FF" />
    <path d="M 185 35 L 187 42 L 194 44 L 187 46 L 185 53 L 183 46 L 176 44 L 183 42 Z" fill="#00D2FF" />
    <path d="M 64 85 L 65 89 L 69 90 L 65 91 L 64 95 L 63 91 L 59 90 L 63 89 Z" fill="#F59E0B" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(235, 126)">
    <!-- JanSetu -->
    <text x="0" y="0" class="brandText themeText" font-size="68" letter-spacing="-0.5" filter="url(#softShadow)">
      JanSetu
    </text>

    <!-- Space + AI -->
    <!-- A in Saffron -->
    <text x="272" y="0" class="brandText" font-size="68" fill="#F59E0B" filter="url(#softShadow)">
      A
    </text>

    <!-- I in Blue Gradient -->
    <text x="320" y="0" class="brandText" font-size="68" fill="url(#aiBlueGrad)" filter="url(#softShadow)">
      I
    </text>
  </g>
</svg>
